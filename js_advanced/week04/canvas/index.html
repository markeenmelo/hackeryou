<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canvas</title>
</head>
<body>
<h2>Canvas</h2>
<canvas height="500" width="500" id="canvas">

</canvas>

<script>
    let canvas = document.getElementById('canvas')
    console.log(canvas)
    let ctx = canvas.getContext('2d')
    let getRandomColor = () => {
        let rgb = `rgb(
                        ${Math.floor(Math.random() * 255)},
                        ${Math.floor(Math.random() * 255)},
                        ${Math.floor(Math.random() * 255)}
        )`
        return rgb
    }

    canvas.addEventListener('mousemove', event => {
        const radians = (Math.PI/180) * 360
        ctx.beginPath()
        ctx.fillStyle = getRandomColor()
        ctx.arc(event.offsetX, event.offsetY, 20, 0, radians)
        ctx.fill()
    })

</script>

<style>
    #canvas {
        border: 1px solid black;
    }
</style>

</body>
</html>
