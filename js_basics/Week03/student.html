<script>
    const student = {
        equipment: ['Laptop', 'Backpack'],
        energy: 80,
        grades: 82,
        uniform: {
            top: "hoddie",
            bottom: 'jeans',
            shoes: 'sneakers'
        },
        eat: function(food) {
            this.energy = this.energy + food;
        },
        newEquipment: function(acquire) {
            this.equipment.push(acquire)
        },
        dressUp: function(newTop, newBottom, newShoes) {
            this.uniform.top = newTop;
            this.uniform.bottom = newBottom;
